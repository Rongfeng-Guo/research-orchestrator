name: Research Snapshot

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Refresh repository-level research outputs
        run: python scripts/refresh_research_outputs.py

      - name: Stamp snapshot metadata
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          manifest_path = Path("outputs/research_refresh_manifest.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload["snapshot"] = {
              "workflow": "research-snapshot",
              "scheduled_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }
          manifest_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: research-snapshot-${{ github.run_number }}
          path: |
            outputs/research_audit/**
            outputs/research_index/**
            outputs/research_brief/**
            outputs/research_dashboard/**
            outputs/research_refresh_manifest.json
          if-no-files-found: error
