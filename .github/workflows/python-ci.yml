name: Python CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify package metadata
        run: python -m compileall src scripts evaluation

      - name: Run CLI smoke checks
        run: |
          python scripts/run_single.py --help
          python scripts/run_eval.py --help
          python scripts/build_search_cache.py --help
          python scripts/run_repl.py --help
          python scripts/run_benchmark.py --help
          python scripts/run_ablation.py --help

      - name: Run test suite
        run: pytest -q
