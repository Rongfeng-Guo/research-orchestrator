name: Python CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify package metadata
        run: python -m compileall src scripts evaluation

      - name: Run CLI smoke checks
        run: |
          python scripts/run_repl.py --help
          python scripts/run_single.py --help
          python scripts/run_eval.py --help
          python scripts/run_benchmark.py --help
          python scripts/run_ablation.py --help
          python scripts/run_all_experiments.py --help
          python scripts/run_evolution.py --help
          python scripts/run_judge.py --help
          python scripts/run_policy_head2head.py --help
          python scripts/run_policy_head2head_cv.py --help
          python scripts/run_real_evidence_iteration.py --help
          python scripts/analyze_search_cache.py --help
          python scripts/audit_paper_readiness.py --help
          python scripts/build_search_cache.py --help
          python scripts/mine_natural_browser_queries.py --help
          python scripts/resurface_search_cache_citations.py --help
          python scripts/split_query_bank.py --help
          python scripts/split_search_cache_dataset.py --help
          python scripts/train_evidence_policy.py --help
          python scripts/train_search_policy_iteration.py --help
          python scripts/audit_research_readiness.py --help
          python scripts/index_research_outputs.py --help
          python scripts/render_research_brief.py --help
          python scripts/render_research_dashboard.py --help
          python scripts/refresh_research_outputs.py --help

      - name: Run test suite
        run: pytest -q
