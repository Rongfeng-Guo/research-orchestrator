name: Packaging Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/packaging-check.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "__init__.py"
      - "scripts/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/packaging-check.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "__init__.py"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip and build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package artifacts
        run: python -m build

      - name: Verify wheel console script metadata
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python - <<'PY'
          from importlib.metadata import entry_points

          expected = {
              "run-research": "scripts.run_single:main",
              "run-eval": "scripts.run_eval:main",
              "run-ablation": "scripts.run_ablation:main",
              "run-benchmark": "scripts.run_benchmark:main",
              "run-judge": "scripts.run_judge:main",
              "run-evolution": "scripts.run_evolution:main",
          }
          installed = {ep.name: ep.value for ep in entry_points(group="console_scripts")}
          missing_or_wrong = {
              name: {"expected": target, "actual": installed.get(name)}
              for name, target in expected.items()
              if installed.get(name) != target
          }
          if missing_or_wrong:
              raise SystemExit(f"Console script metadata mismatch: {missing_or_wrong}")
          PY
