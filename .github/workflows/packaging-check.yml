name: Packaging Check

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "__init__.py"
      - "scripts/**"
      - "src/**"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "__init__.py"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip and build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package artifacts
        run: python -m build
