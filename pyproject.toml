[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-orchestrator"
version = "0.1.1"
description = "A structured deep research orchestrator for complex, evidence-backed workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Rongfeng Guo", email = "rongfengguo.cs@gmail.com"},
]
keywords = ["research-orchestrator", "deep-research", "agent", "llm", "evidence", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # 核心依赖
    "openai>=1.0",
    "transformers>=4.40",
    "torch>=2.0",
    "numpy>=1.24",
    "aiohttp>=3.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",  # 多后端 .env 配置支持
    "langsmith>=0.1.0",   # Agent 流程追踪与可观测性
    "sentence-transformers>=2.5",
    "networkx>=3.0",      # 用于 TextRank 等图算法
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "datasets>=2.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "beautifulsoup4>=4.12",  # BrowserTool HTML 正文提取
    "brotli>=1.1",  # BrowserTool br 压缩响应解码
    # vLLM 推理服务（可选，本地部署时安装）
    # "vllm",
    # PEFT / LoRA 微调（自进化模块需要）
    # "peft",
    # "accelerate",
    # "deepspeed",
]

[project.optional-dependencies]
# vLLM 推理服务依赖
serve = [
    "vllm>=0.4.0",
]
# 自进化训练依赖
train = [
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "deepspeed>=0.14.0",
    "wandb",
]
# 开发依赖
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "flake8",
]
# 全部可选依赖
all = [
    "vllm>=0.4.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "deepspeed>=0.14.0",
    "wandb",
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "flake8",
]

[project.scripts]
# 命令行快捷入口
run-research = "scripts.run_single:main"
run-eval = "scripts.run_eval:main"
run-ablation = "scripts.run_ablation:main"
run-benchmark = "scripts.run_benchmark:main"
run-judge = "scripts.run_judge:main"
run-evolution = "scripts.run_evolution:main"

[project.urls]
Homepage = "https://github.com/Rongfeng-Guo/research-orchestrator"
Repository = "https://github.com/Rongfeng-Guo/research-orchestrator"
Issues = "https://github.com/Rongfeng-Guo/research-orchestrator/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*", "evaluation*", "scripts", "configs*"]

[tool.setuptools.package-data]
configs = ["*.yaml", "**/*.yaml"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
